<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict CSP: only our own scripts/styles, no inline code, no eval, nothing remote.
       Images: same-origin (/api/images, /api/attachments) and data:/blob: only, so model output can't load remote images. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Harness</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/chat.css">
  <link rel="stylesheet" href="css/views.css">
  <script src="js/boot-theme.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="app" class="app-root">
    <div class="boot-splash" aria-hidden="true"><span class="spinner"></span></div>
  </div>
  <noscript><p class="boot-error">Harness needs JavaScript to run.</p></noscript>
</body>
</html>
