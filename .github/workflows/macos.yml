name: macOS verification

# Harness is developed on Linux against fake backends. This workflow is the real-Mac check:
# it runs on GitHub's Apple Silicon runners (M1-class, 7 GB RAM - close to an 8 GB MacBook)
# and exercises the app against a real Ollama.
#
# The probe scripts print one compact line per fact as the last step of each job, so the facts
# sit together at the end of the job log.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run"
        type: choice
        default: all
        options: [all, backend, desktop, ui, native, live, e2e, hub, ollama, nemotron]
      live_groups:
        description: "live-check groups to run"
        type: string
        default: env,ollama,e2e
      live_samples:
        description: "Comma-separated substrings of raw sample names to print"
        type: string
        default: ""
      nemotron_tag:
        description: "Nemotron quant tag to pull from hf.co/unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF"
        type: string
        default: UD-Q3_K_XL
      ui_filter:
        description: "ui job: only tests whose name matches this pattern (empty = all)"
        type: string
        default: ""

permissions:
  contents: read

# One run per job selection at a time: a "native" run does not cancel an "all" run and vice versa.
concurrency:
  group: macos-${{ github.ref }}-${{ inputs.jobs }}
  cancel-in-progress: true

env:
  OLLAMA_HOST: 127.0.0.1:11434
  O: http://127.0.0.1:11434
  HF_REPO: unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF

jobs:
  backend:
    name: Backend on macOS
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'backend' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Machine
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          node -v
      - name: Backend and desktop unit tests
        run: |
          set -o pipefail
          # The spec reporter repeats every failing test with its error at the end of the output.
          node --test --test-concurrency=4 --test-reporter=spec "test/*.test.mjs" "electron/test/*.test.mjs" "scripts/test/*.test.mjs" 2>&1 | tail -n 170
      - name: Real Keychain check (a throw-away item, removed afterwards)
        run: |
          set -o pipefail
          HARNESS_TEST_REAL_KEYCHAIN=1 node --test --test-reporter=spec test/keychain-real.test.mjs 2>&1 | tail -n 45
      - name: Server boots with no node_modules (0.2 defaults - needs_setup, data routes refused)
        run: |
          set -euo pipefail
          test ! -d node_modules
          export HARNESS_DATA_DIR="$RUNNER_TEMP/harness-data"
          node server/index.mjs --port 4747 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4747/api/health > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4747/api/health
          echo
          curl -fsS http://127.0.0.1:4747/api/security | jq -c '{state, mode, offlineLock}'
          curl -sS -o /dev/null -w 'GET /api/system without setup: HTTP %{http_code} (expected 423)\n' http://127.0.0.1:4747/api/system
          curl -fsS -o /dev/null -w 'index.html: HTTP %{http_code}\n' http://127.0.0.1:4747/
          stat -f 'data dir mode %Lp (expected 700)' "$HARNESS_DATA_DIR"
          node scripts/doctor.mjs 2>&1 | grep -E 'Harness .*running|Data protection|Internet blocker|self-test' || true
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          tail -n 15 "$RUNNER_TEMP/server.log"

  desktop:
    name: Desktop app on macOS (Electron)
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'desktop' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install developer dependencies
        run: npm ci
      - name: Desktop end-to-end, from source
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | grep -vE '^ok ' | tail -n 40
      - name: Build Harness.app and the disk image
        run: npm run dist
      - name: Desktop end-to-end, packaged app
        run: |
          set -o pipefail
          HARNESS_E2E_APP="$PWD/dist/mac-arm64/Harness.app/Contents/MacOS/Harness" npm run test:e2e 2>&1 | grep -vE '^ok ' | tail -n 40
      - uses: actions/upload-artifact@v4
        with:
          name: Harness-mac-arm64
          path: dist/*.dmg
          retention-days: 7
      - name: Inspect the build
        run: |
          set -euo pipefail
          APP=dist/mac-arm64/Harness.app
          du -sh "$APP" dist/*.dmg
          file "$APP/Contents/MacOS/Harness"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier|Format|Signature|TeamIdentifier|flags|Authority' || true
          codesign --verify --deep --strict "$APP"
          echo "signature verifies (deep, strict)"
          spctl --assess --type execute --verbose "$APP" 2>&1 || echo "spctl does not accept it (expected for an ad-hoc signature; a locally built app is not quarantined)"
          xattr -l "$APP" | head -n 5 || true
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(Name|Identifier|ShortVersionString|IconFile)|LSMinimumSystemVersion'
          npx asar list "$APP/Contents/Resources/app.asar" | awk -F/ 'NF>1 {print $2}' | sort | uniq -c

  ui:
    name: Web UI in WebKit (the engine of the native app and Safari)
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'ui' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      UI_FILTER: ${{ inputs.ui_filter }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright and its WebKit build
        run: |
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install webkit > /dev/null 2>&1
          node -e "console.log('playwright ' + require('playwright/package.json').version)"
      - name: UI tests in WebKit
        # The job fails when a test fails. The log ends with the counts and the details of every failing test.
        run: |
          set +e
          HARNESS_UI_BROWSER=webkit node --test --test-concurrency=2 --test-reporter=spec ${UI_FILTER:+--test-name-pattern="$UI_FILTER"} "test/ui/*.test.mjs" > "$RUNNER_TEMP/ui-webkit.log" 2>&1
          code=$?
          awk '/failing tests:/{p=1} p' "$RUNNER_TEMP/ui-webkit.log" | grep -vE 'node:(internal|async_hooks)' | cut -c1-700 | head -n 320
          LC_ALL=C grep -aE '^[^a-zA-Z0-9]{1,5}(tests|suites|pass|fail|cancelled|skipped|duration_ms) [0-9.]+$' "$RUNNER_TEMP/ui-webkit.log"
          echo "node --test exit code $code"
          exit $code

  live:
    name: Live check against a real Ollama
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'live' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama, pull tiny models
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 LLAMA_ARG_CACHE_RAM=512 \
            nohup ollama serve > /tmp/harness-ci-ollama.log 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          ollama pull qwen3:0.6b > /dev/null 2>&1
          ollama pull gemma3:270m > /dev/null 2>&1
          ollama pull all-minilm > /dev/null 2>&1
      - name: Live check
        # --allow-internet: the in-process Harness (0.2 defaults: password + internet blocked) opens its internet
        # window with its throw-away password to test the live catalogue adapters, then blocks again.
        # e2e.blocker.sandboxed_ollama starts a second Harness that starts its own Ollama (on a spare port) under
        # the macOS sandbox and sends a pull straight to it.
        run: |
          node scripts/live-check.mjs --only "${{ inputs.live_groups || 'env,ollama,e2e' }}" --allow-pull --allow-internet --timeout-scale 4 --quiet --no-color \
            --json /tmp/harness-live.json --markdown /tmp/harness-live.md || echo "live-check exit code $?"
          # Prints every check that did not pass and exits non-zero when any check FAILed (warnings do not fail the job).
          node scripts/ci/summarize-live-check.mjs /tmp/harness-live.json "${{ inputs.live_samples }}"

  e2e:
    name: Real Nemotron through Harness, end to end
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'e2e' }}
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      TAG: hf.co/unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF:${{ inputs.nemotron_tag || 'UD-Q3_K_XL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Ollama (not started - Harness must start it itself)
        run: brew install ollama > /dev/null
      - name: Doctor on a fresh Mac
        run: node scripts/doctor.mjs 2>&1 | tail -n 45 || true
      - name: Choose a Harness password (as the owner would in the setup screen; it stays in a 0600 file)
        run: |
          set -euo pipefail
          umask 077
          node -e 'process.stdout.write(require("crypto").randomBytes(18).toString("base64url"))' > "$RUNNER_TEMP/harness-pw"
          node server/index.mjs --port 4747 > "$RUNNER_TEMP/setup-server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:4747/api/health > /dev/null 2>&1 && break; sleep 0.2; done
          # The password goes in on stdin and the recovery key is checked for shape and discarded - neither is printed.
          node -e 'let s="";process.stdin.on("data",(d)=>{s+=d}).on("end",async()=>{const r=await fetch("http://127.0.0.1:4747/api/security/setup",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({password:s.trim()})});const j=await r.json().catch(()=>({}));console.log(`setup: HTTP ${r.status}, state ${j.state}, recovery key ${/^HRK1-/.test(j.recoveryKey||"")?"returned (discarded)":"MISSING"}`);process.exit(r.ok?0:1)})' < "$RUNNER_TEMP/harness-pw"
          kill "$pid"; wait "$pid" 2>/dev/null || true
          node scripts/doctor.mjs --state
      - name: Get the model the way the setup script does (password on stdin; allow internet for the download only)
        run: |
          set -o pipefail
          node scripts/get-model.mjs --yes --password-stdin --model "$TAG" < "$RUNNER_TEMP/harness-pw" 2>&1 | tr '\r' '\n' | grep -v '^$' | grep -vE '^  (pulling|verifying|writing)' | tail -n 30
          sleep 3
          if pgrep -x ollama > /dev/null; then echo "NOTE: an ollama process is still running after get-model exited"; else echo "ollama is stopped again, as expected"; fi
          tail -n 15 "$HOME/Library/Application Support/Harness/logs/harness.log" 2>/dev/null || true
      - name: Start Ollama the way Harness would
        run: |
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_NO_CLOUD=1 LLAMA_ARG_CACHE_RAM=512 \
            nohup ollama serve > /tmp/harness-ci-ollama.log 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          curl -fsS "$O/api/tags" | jq -c '.models[] | {name, size}'
      - name: Internet blocked again, data locked at rest
        run: |
          node scripts/doctor.mjs 2>&1 | grep -E 'Harness .*running|Harness is not running|Data protection|Internet blocker|self-test' || true
          # The data dir holds no readable chat text: grep for a word every settings file used to contain.
          if grep -rIl 'providers' "$HOME/Library/Application Support/Harness" 2>/dev/null | grep -vE '/(logs|Electron)/|launch.json|vault.json|harness.lock|measurements.json' | head -n 5; then echo "NOTE: plain-text files above"; else echo "no plain-text data files found"; fi
      - name: The user's scenario, end to end, with the shipped defaults
        # Password, encryption and the internet blocker are all on: the script sets a throw-away password,
        # allows the network with it for the download, and proves the lock and the on-disk encryption.
        run: node scripts/ci/nemotron-e2e.mjs

  hub:
    name: Model catalogue endpoints (fact-finding)
    if: ${{ inputs.jobs == 'hub' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Hugging Face and ollama.com
        run: node scripts/ci/hub-probe.mjs

  ollama:
    name: Real Ollama API behaviour
    if: ${{ inputs.jobs == 'ollama' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CHAT: qwen3:0.6b
      PLAIN: gemma3:270m
      OLLAMA_LOG: /tmp/harness-ci-ollama.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama, pull tiny models
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > "$OLLAMA_LOG" 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          ollama pull "$CHAT" > /dev/null 2>&1
          ollama pull "$PLAIN" > /dev/null 2>&1
      - name: Probes
        run: node scripts/ci/mac-probe.mjs api

  nemotron:
    name: Nemotron 3.5 Bolt E4B on a Mac runner
    if: ${{ inputs.jobs == 'nemotron' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.nemotron_tag || 'UD-Q3_K_XL' }}
      OLLAMA_LOG: /tmp/harness-ci-ollama.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > "$OLLAMA_LOG" 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
      - name: Probes
        run: node scripts/ci/mac-probe.mjs nemotron

  native:
    name: Native macOS app (WKWebView + bridge + offline lock)
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'native' }}
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      FACTS: /tmp/native-facts.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Toolchain
        run: |
          touch "$FACTS"
          { echo "toolchain| macOS $(sw_vers -productVersion) $(uname -m) $(sysctl -n machdep.cpu.brand_string), RAM $(($(sysctl -n hw.memsize) / 1073741824)) GB"
            echo "toolchain| Command Line Tools: $(DEVELOPER_DIR=/Library/Developer/CommandLineTools xcrun swiftc --version 2>&1 | head -n 1)"
          } >> "$FACTS"
      - name: Build Harness.app with the Command Line Tools only
        timeout-minutes: 12
        env:
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
        run: |
          if scripts/build-native.sh > /tmp/build.log 2>&1; then
            grep '^==>' /tmp/build.log | sed 's/^/build| /' >> "$FACTS"
            echo "build| swiftc warnings: $(grep -c 'warning:' /tmp/build.log)" >> "$FACTS"
          else
            grep -E '^/.*: error:' /tmp/build.log | sed "s#$PWD/##" | head -n 30 | sed 's/^/build-error| /' >> "$FACTS"
            tail -n 5 /tmp/build.log | sed 's/^/build-tail| /' >> "$FACTS"
            exit 1
          fi
      - name: Inspect the bundle
        run: |
          A=dist/native/Harness.app
          { echo "bundle| app $(du -sh $A | cut -f1), zip $(du -sh dist/native/*.zip | cut -f1); node $(du -sh $A/Contents/MacOS/node | cut -f1), Harness binary $(du -sh $A/Contents/MacOS/Harness | cut -f1), server+public $(du -sh $A/Contents/Resources/app | cut -f1)"
            echo "bundle| $(codesign --verify --deep --strict $A 2>&1 && echo 'codesign --verify --deep --strict: ok')"
            echo "bundle| $(codesign -dv $A 2>&1 | grep -E '^(Identifier|Signature|CodeDirectory)' | tr '\n' ' ')"
            echo "bundle| node: $($A/Contents/MacOS/node -v) $(codesign -dv $A/Contents/MacOS/node 2>&1 | grep -E '^(Authority|TeamIdentifier)' | head -n 2 | tr '\n' ' ')"
            echo "bundle| $(file -b $A/Contents/MacOS/Harness)"
          } >> "$FACTS"
      - name: Self-test against the mock backend (two launches, one data folder)
        run: |
          node -e "const n=20*1024*1024,b=Buffer.alloc(n);for(let i=0;i<n;i++)b[i]=(Math.imul(i,31)+7)&255;require('fs').writeFileSync('/tmp/pick-20mb.bin',b)"
          node native/test/run-selftest.mjs --app dist/native/Harness.app --label mock --script native/test/selftest-mock.js --backend native/test/mock-backend.mjs --launches 2 --files /tmp/pick-20mb.bin --timeout 240 > /dev/null
      - name: Offline-lock profile with a real Ollama
        continue-on-error: true
        run: |
          brew install ollama > /dev/null 2>&1
          KEEP=30 node native/ci/run.mjs 1500 ollama -- node native/ci/sandbox-ollama.mjs server/security/offline-lock.sb qwen3:0.6b > /dev/null
      - name: Self-test against the real backend (password mode, Harness starts a sandboxed Ollama)
        if: ${{ hashFiles('server/bridge/server.mjs') != '' }}
        continue-on-error: true
        run: |
          node native/test/bridge-client.mjs server/index.mjs "$RUNNER_TEMP/bridge-check" 2>&1 | sed 's/^/bridge| /' >> "$FACTS"
          node native/test/run-selftest.mjs --app dist/native/Harness.app --label real --script native/test/selftest-real.js --launches 3 --timeout 900 --settle 5 --log-lines 20 --show chatStreamsFromRealModel,appNapHeldOnlyWhileGenerating,offlineLockAroundOllama,allowThenBlockAgain,lockUnloadsAndLocks,keychainModeOpensWithoutPassword,wrongKeychainKeyFallsBackToPassword > /dev/null
      - name: Keychain mode on the default data folder (the real user's case)
        if: ${{ hashFiles('server/bridge/server.mjs') != '' }}
        continue-on-error: true
        run: node native/test/run-selftest.mjs --app dist/native/Harness.app --label keychain-default --script native/test/selftest-keychain-default.js --launches 2 --timeout 240 --data default --allow-default-data > /dev/null
      - name: Idle memory, native app on the real UI
        if: ${{ hashFiles('server/bridge/server.mjs') != '' }}
        continue-on-error: true
        run: node native/test/run-selftest.mjs --app dist/native/Harness.app --label idle --script native/test/selftest-idle.js --launches 1 --timeout 120 --settle 15 > /dev/null
      - name: Electron build for comparison (size, idle memory; only when the native job runs alone)
        if: ${{ inputs.jobs == 'native' && hashFiles('server/bridge/server.mjs') != '' }}
        continue-on-error: true
        run: |
          npm ci > /dev/null 2>&1
          npm run dist:app > /tmp/electron-build.log 2>&1 || tail -n 5 /tmp/electron-build.log | sed 's/^/electron-build| /' >> "$FACTS"
          node native/ci/electron-memory.mjs dist/mac-arm64/Harness.app 20 > /dev/null
      - name: Facts
        if: always()
        run: |
          cat "$FACTS"
          node native/ci/summary.mjs mock real keychain-default idle
