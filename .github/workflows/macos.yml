name: macOS verification

# Harness is developed on Linux against fake backends. This workflow is the real-Mac check:
# it runs on GitHub's Apple Silicon runners (M1-class, 7 GB RAM - close to an 8 GB MacBook)
# and exercises the app against a real Ollama.
#
# The probe scripts print one compact line per fact as the last step of each job, so the facts
# sit together at the end of the job log.
on:
  workflow_dispatch:
    inputs:
      jobs:
        description: "Which jobs to run"
        type: choice
        default: all
        options: [all, backend, desktop, live, e2e, ollama, nemotron]
      live_groups:
        description: "live-check groups to run"
        type: string
        default: env,ollama,e2e
      live_samples:
        description: "Comma-separated substrings of raw sample names to print"
        type: string
        default: ""
      nemotron_tag:
        description: "Nemotron quant tag to pull from hf.co/unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF"
        type: string
        default: UD-Q3_K_XL

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_HOST: 127.0.0.1:11434
  O: http://127.0.0.1:11434
  HF_REPO: unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF

jobs:
  backend:
    name: Backend on macOS
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'backend' }}
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Machine
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          node -v
      - name: Backend and desktop unit tests
        run: |
          set -o pipefail
          # The spec reporter repeats every failing test with its error at the end of the output.
          node --test --test-concurrency=4 --test-reporter=spec "test/*.test.mjs" "electron/test/*.test.mjs" 2>&1 | tail -n 170
      - name: Server boots with no node_modules
        run: |
          set -euo pipefail
          test ! -d node_modules
          export HARNESS_DATA_DIR="$RUNNER_TEMP/harness-data"
          node server/index.mjs --port 4747 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4747/api/health > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4747/api/health
          echo
          curl -fsS http://127.0.0.1:4747/api/system | jq -c '.machine'
          curl -fsS -o /dev/null -w 'index.html: HTTP %{http_code}\n' http://127.0.0.1:4747/
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/server.log"

  desktop:
    name: Desktop app on macOS (Electron)
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'desktop' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install developer dependencies
        run: npm ci
      - name: Desktop end-to-end, from source
        run: npm run test:e2e
      - name: Build Harness.app and the disk image
        run: npm run dist
      - name: Desktop end-to-end, packaged app
        run: HARNESS_E2E_APP="$PWD/dist/mac-arm64/Harness.app/Contents/MacOS/Harness" npm run test:e2e
      - name: UI tests in WebKit (Safari engine)
        continue-on-error: true
        run: |
          npm install --no-save playwright > /dev/null 2>&1
          npx playwright install webkit > /dev/null 2>&1
          HARNESS_UI_BROWSER=webkit npm run test:ui 2>&1 | grep -E '^(not ok|# (tests|pass|fail))|^  +(error|message):' | head -n 80
      - uses: actions/upload-artifact@v4
        with:
          name: Harness-mac-arm64
          path: dist/*.dmg
          retention-days: 7
      - name: Inspect the build
        run: |
          set -euo pipefail
          APP=dist/mac-arm64/Harness.app
          du -sh "$APP" dist/*.dmg
          file "$APP/Contents/MacOS/Harness"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier|Format|Signature|TeamIdentifier|flags|Authority' || true
          codesign --verify --deep --strict "$APP"
          echo "signature verifies (deep, strict)"
          spctl --assess --type execute --verbose "$APP" 2>&1 || echo "spctl does not accept it (expected for an ad-hoc signature; a locally built app is not quarantined)"
          xattr -l "$APP" | head -n 5 || true
          plutil -p "$APP/Contents/Info.plist" | grep -E 'CFBundle(Name|Identifier|ShortVersionString|IconFile)|LSMinimumSystemVersion'
          npx asar list "$APP/Contents/Resources/app.asar" | awk -F/ 'NF>1 {print $2}' | sort | uniq -c

  live:
    name: Live check against a real Ollama
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'live' }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama, pull tiny models
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 LLAMA_ARG_CACHE_RAM=512 \
            nohup ollama serve > /tmp/harness-ci-ollama.log 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          ollama pull qwen3:0.6b > /dev/null 2>&1
          ollama pull gemma3:270m > /dev/null 2>&1
          ollama pull all-minilm > /dev/null 2>&1
      - name: Live check
        run: |
          node scripts/live-check.mjs --only "${{ inputs.live_groups || 'env,ollama,e2e' }}" --allow-pull --timeout-scale 4 --quiet --no-color \
            --json /tmp/harness-live.json --markdown /tmp/harness-live.md || echo "live-check exit code $?"
          node scripts/ci/summarize-live-check.mjs /tmp/harness-live.json "${{ inputs.live_samples }}"

  e2e:
    name: Real Nemotron through Harness, end to end
    if: ${{ inputs.jobs == 'all' || inputs.jobs == 'e2e' }}
    runs-on: macos-latest
    timeout-minutes: 55
    env:
      TAG: hf.co/unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF:${{ inputs.nemotron_tag || 'UD-Q3_K_XL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Ollama (not started - Harness must start it itself)
        run: brew install ollama > /dev/null
      - name: Doctor on a fresh Mac
        run: node scripts/doctor.mjs 2>&1 | tail -n 45 || true
      - name: Get the model the way the setup script does (Harness starts Ollama, pulls, makes the text-only copy)
        run: |
          set -o pipefail
          node scripts/get-model.mjs --yes --model "$TAG" 2>&1 | tr '\r' '\n' | grep -v '^$' | tail -n 30
          sleep 3
          if pgrep -x ollama > /dev/null; then echo "NOTE: an ollama process is still running after get-model exited"; else echo "ollama is stopped again, as expected"; fi
          tail -n 15 "$HOME/Library/Application Support/Harness/logs/harness.log" 2>/dev/null || true
      - name: Start Ollama the way Harness would
        run: |
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 OLLAMA_NO_CLOUD=1 LLAMA_ARG_CACHE_RAM=512 \
            nohup ollama serve > /tmp/harness-ci-ollama.log 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          curl -fsS "$O/api/tags" | jq -c '.models[] | {name, size}'
      - name: The user's scenario, end to end
        run: node scripts/ci/nemotron-e2e.mjs

  ollama:
    name: Real Ollama API behaviour
    if: ${{ inputs.jobs == 'ollama' }}
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      CHAT: qwen3:0.6b
      PLAIN: gemma3:270m
      OLLAMA_LOG: /tmp/harness-ci-ollama.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama, pull tiny models
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > "$OLLAMA_LOG" 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          ollama pull "$CHAT" > /dev/null 2>&1
          ollama pull "$PLAIN" > /dev/null 2>&1
      - name: Probes
        run: node scripts/ci/mac-probe.mjs api

  nemotron:
    name: Nemotron 3.5 Bolt E4B on a Mac runner
    if: ${{ inputs.jobs == 'nemotron' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ inputs.nemotron_tag || 'UD-Q3_K_XL' }}
      OLLAMA_LOG: /tmp/harness-ci-ollama.log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          brew install ollama > /dev/null
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > "$OLLAMA_LOG" 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
      - name: Probes
        run: node scripts/ci/mac-probe.mjs nemotron
