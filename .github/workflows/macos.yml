name: macOS verification

# Harness is developed on Linux against fake backends. This workflow is the real-Mac check:
# it runs on GitHub's Apple Silicon runners (M1-class, 7 GB RAM - close to an 8 GB MacBook)
# and exercises the app against a real Ollama.
on:
  workflow_dispatch:
    inputs:
      nemotron:
        description: "Also download and run Nemotron 3.5 Bolt E4B (several GB)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Machine
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string
          echo "RAM bytes: $(sysctl -n hw.memsize)"
          node -v
      - name: Backend test suite
        run: npm test
      - name: Server boots with no node_modules
        run: |
          set -euo pipefail
          test ! -d node_modules
          export HARNESS_DATA_DIR="$RUNNER_TEMP/harness-data"
          node server/index.mjs --port 4747 > "$RUNNER_TEMP/server.log" 2>&1 &
          pid=$!
          for _ in $(seq 1 100); do
            curl -fsS http://127.0.0.1:4747/api/health > /dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:4747/api/health
          echo
          curl -fsS http://127.0.0.1:4747/api/system | jq '{app: .app, machine: .machine, ollama: .ollama}'
          curl -fsS http://127.0.0.1:4747/api/models/recommended | jq .
          curl -fsS -o /dev/null -w 'index.html: HTTP %{http_code}\n' http://127.0.0.1:4747/
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "--- server log"
          cat "$RUNNER_TEMP/server.log"

  ollama:
    name: Real Ollama API shapes
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      O: http://127.0.0.1:11434
      CHAT: qwen3:0.6b
      PLAIN: gemma3:270m
      EMBED: all-minilm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and start Ollama
        run: |
          set -euo pipefail
          brew install ollama
          OLLAMA_FLASH_ATTENTION=1 OLLAMA_KV_CACHE_TYPE=q8_0 OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for _ in $(seq 1 100); do
            curl -fsS "$O/api/version" > /dev/null 2>&1 && break
            sleep 0.3
          done
          curl -fsS "$O/api/version"
          echo
          which ollama
      - name: Pull tiny models
        run: |
          set -euo pipefail
          ollama pull "$CHAT"
          ollama pull "$PLAIN"
          ollama pull "$EMBED"
          curl -fsS "$O/api/tags" | jq '.models[] | {name, model, size, digest: .digest[0:12], details}'
      - name: "Probe: show"
        if: always()
        run: |
          for m in "$CHAT" "$PLAIN" "$EMBED"; do
            echo "=== show $m"
            curl -sS "$O/api/show" -d "{\"model\":\"$m\"}" \
              | jq '{capabilities, details, parameters, model_info: (.model_info | with_entries(select(.key | test("architecture|context_length|block_count|head_count|key_length|value_length|embedding_length|sliding_window|parameter_count|file_type"))))}'
          done
          echo "=== show unknown model"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/show" -d '{"model":"no-such-model:1"}'
      - name: "Probe: streaming chat, thinking, token counts"
        if: always()
        run: |
          echo "=== chat stream (think: true), first 6 and last line"
          curl -sS "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":true,\"messages\":[{\"role\":\"user\",\"content\":\"What is 2+2? Answer in one word.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":200}}" > "$RUNNER_TEMP/chat.ndjson"
          head -n 6 "$RUNNER_TEMP/chat.ndjson"
          echo "..."
          tail -n 1 "$RUNNER_TEMP/chat.ndjson" | jq .
          echo "=== same prompt again (warm cache): is prompt_eval_count still the full prompt?"
          curl -sS "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":false,\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"What is 2+2? Answer in one word.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":50}}" | jq 'del(.message.content)'
          echo "=== think:true on a model without thinking"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/chat" -d "{\"model\":\"$PLAIN\",\"think\":true,\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"options\":{\"num_predict\":5}}"
      - name: "Probe: keep_alive forms"
        if: always()
        run: |
          for ka in '"5m"' '300' '-1' '"-1"' '"30"' '0'; do
            printf 'keep_alive=%s -> ' "$ka"
            curl -sS -o "$RUNNER_TEMP/ka.json" -w 'HTTP %{http_code} ' "$O/api/chat" -d "{\"model\":\"$CHAT\",\"stream\":false,\"keep_alive\":$ka,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":3}}"
            jq -c '{error, done_reason}' "$RUNNER_TEMP/ka.json"
          done
      - name: "Probe: ps, num_ctx and memory growth"
        if: always()
        run: |
          for ctx in 2048 8192 32768; do
            curl -sS -o /dev/null "$O/api/chat" -d "{\"model\":\"$CHAT\",\"stream\":false,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"options\":{\"num_ctx\":$ctx,\"num_predict\":3}}"
            echo "=== ps after num_ctx=$ctx"
            curl -sS "$O/api/ps" | jq -c '.models[] | {name, size, size_vram, context_length, expires_at}'
          done
          echo "=== unload via /api/generate keep_alive 0, then poll ps"
          start=$(date +%s)
          curl -sS "$O/api/generate" -d "{\"model\":\"$CHAT\",\"keep_alive\":0}"
          echo
          for i in $(seq 1 100); do
            n=$(curl -sS "$O/api/ps" | jq '.models | length')
            if [ "$n" = "0" ]; then echo "ps empty after ~$(( $(date +%s) - start ))s ($i polls)"; break; fi
            sleep 0.2
          done
      - name: "Probe: tool calling"
        if: always()
        run: |
          TOOLS='[{"type":"function","function":{"name":"get_weather","description":"Get the current weather for a city","parameters":{"type":"object","properties":{"city":{"type":"string"}},"required":["city"]}}}]'
          echo "=== tool call (non-stream)"
          curl -sS "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":false,\"stream\":false,\"tools\":$TOOLS,\"messages\":[{\"role\":\"user\",\"content\":\"What is the weather in Paris? Use the tool.\"}],\"options\":{\"num_ctx\":4096,\"num_predict\":200,\"temperature\":0}}" | tee "$RUNNER_TEMP/tool.json" | jq .
          echo "=== tool call (stream) - lines containing tool_calls"
          curl -sS "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":false,\"tools\":$TOOLS,\"messages\":[{\"role\":\"user\",\"content\":\"What is the weather in Paris? Use the tool.\"}],\"options\":{\"num_ctx\":4096,\"num_predict\":200,\"temperature\":0}}" | grep tool_calls | head -n 3
          echo "=== send the tool result back (role tool + tool_name)"
          CALLS=$(jq -c '.message.tool_calls // []' "$RUNNER_TEMP/tool.json")
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":false,\"stream\":false,\"tools\":$TOOLS,\"messages\":[{\"role\":\"user\",\"content\":\"What is the weather in Paris? Use the tool.\"},{\"role\":\"assistant\",\"content\":\"\",\"tool_calls\":$CALLS},{\"role\":\"tool\",\"tool_name\":\"get_weather\",\"content\":\"18 C, sunny\"}],\"options\":{\"num_ctx\":4096,\"num_predict\":100,\"temperature\":0}}"
          echo "=== tools on a model without tool support"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/chat" -d "{\"model\":\"$PLAIN\",\"stream\":false,\"tools\":$TOOLS,\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"options\":{\"num_predict\":5}}"
          echo "=== structured output with a JSON schema"
          curl -sS "$O/api/chat" -d "{\"model\":\"$CHAT\",\"think\":false,\"stream\":false,\"format\":{\"type\":\"object\",\"properties\":{\"title\":{\"type\":\"string\"}},\"required\":[\"title\"]},\"messages\":[{\"role\":\"user\",\"content\":\"Give a short title for a chat about cooking pasta.\"}],\"options\":{\"num_ctx\":2048,\"num_predict\":60,\"temperature\":0}}" | jq '.message'
      - name: "Probe: embeddings, pull errors"
        if: always()
        run: |
          echo "=== embed"
          curl -sS "$O/api/embed" -d "{\"model\":\"$EMBED\",\"input\":[\"hello world\",\"goodbye\"]}" | jq '{model, count: (.embeddings | length), dims: (.embeddings[0] | length), total_duration, prompt_eval_count}'
          echo "=== ps with embedding model loaded"
          curl -sS "$O/api/ps" | jq -c '.models[] | {name, size, size_vram, context_length}'
          echo "=== unload embedding model via /api/generate keep_alive 0"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/generate" -d "{\"model\":\"$EMBED\",\"keep_alive\":0}"
          echo "=== unload embedding model via /api/embed keep_alive 0 with empty input"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/embed" -d "{\"model\":\"$EMBED\",\"input\":[],\"keep_alive\":0}"
          sleep 1
          curl -sS "$O/api/ps" | jq -c '.models'
          echo "=== pull an unknown model (stream)"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/pull" -d '{"model":"no-such-model-xyz:1","stream":true}'
          echo "=== pull an already-present model (stream)"
          curl -sS "$O/api/pull" -d "{\"model\":\"$PLAIN\",\"stream\":true}" | head -n 8
          echo "=== chat with an unknown model"
          curl -sS -w '\nHTTP %{http_code}\n' "$O/api/chat" -d '{"model":"no-such-model-xyz:1","messages":[{"role":"user","content":"hi"}]}'
      - name: "Probe: do the Nemotron tags and quant files exist?"
        if: always()
        run: |
          for tag in e4b latest; do
            echo "=== registry.ollama.ai library/nemotron-3.5-bolt:$tag"
            curl -sS -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' "https://registry.ollama.ai/v2/library/nemotron-3.5-bolt/manifests/$tag" \
              | jq '{layers: [.layers[]? | {mediaType, size}], errors}'
          done
          echo "=== Hugging Face GGUF files"
          curl -sS "https://huggingface.co/api/models/unsloth/NVIDIA-Nemotron-3.5-Bolt-E4B-GGUF/tree/main" | jq -r '.[]? | "\(.size)\t\(.path)"'
      - name: "Nemotron 3.5 Bolt E4B: real metadata and a tiny run"
        if: ${{ always() && inputs.nemotron }}
        run: |
          ollama pull nemotron-3.5-bolt:e4b
          curl -sS "$O/api/show" -d '{"model":"nemotron-3.5-bolt:e4b"}' | jq '{capabilities, details, parameters, model_info: (.model_info | with_entries(select(.key | test("tokens|token_type|scores|merges") | not)))}'
          curl -sS "$O/api/chat" -d '{"model":"nemotron-3.5-bolt:e4b","stream":false,"messages":[{"role":"user","content":"Say hello in five words."}],"options":{"num_ctx":2048,"num_predict":30}}' | jq .
          curl -sS "$O/api/ps" | jq -c '.models[] | {name, size, size_vram, context_length}'
      - name: Ollama server log
        if: always()
        run: tail -n 150 "$RUNNER_TEMP/ollama.log" || true
