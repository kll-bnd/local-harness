<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Harness app icon. Source of build/icon.png and build/icon.icns (npm run icons).
       macOS icon grid: 824×824 rounded square at (100,100) on a 1024 canvas, with a soft drop shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A9488"/>
      <stop offset="0.55" stop-color="#11585E"/>
      <stop offset="1" stop-color="#0B2A3F"/>
    </linearGradient>
    <linearGradient id="ink" gradientUnits="userSpaceOnUse" x1="0" y1="358" x2="0" y2="610">
      <stop offset="0" stop-color="#127A72"/>
      <stop offset="1" stop-color="#0D3B4C"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#F6E7CF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="12" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="10" result="b"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <!-- speech bubble -->
  <g filter="url(#soft)">
    <path fill="url(#paper)" d="M352 256 H672 A128 128 0 0 1 800 384 V584 A128 128 0 0 1 672 712 H452 L318 800 Q300 812 304 790 L322 706 A128 128 0 0 1 224 584 V384 A128 128 0 0 1 352 256 Z"/>
  </g>
  <!-- H -->
  <g fill="url(#ink)">
    <rect x="368" y="358" width="68" height="252" rx="34"/>
    <rect x="588" y="358" width="68" height="252" rx="34"/>
    <rect x="400" y="456" width="224" height="56" rx="28"/>
  </g>
  <!-- small amber spark: "local intelligence" -->
  <path fill="#F5B841" d="M742 196 C748 232 760 244 796 250 C760 256 748 268 742 304 C736 268 724 256 688 250 C724 244 736 232 742 196 Z"/>
</svg>
